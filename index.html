<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Productos</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Registro de Productos</h1>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Agregar Producto</h2>
      </div>
      <div class="card-content">
        <form id="formulario-producto">
          <form id="formulario-producto" novalidate>
            <div class="form-group">
              <label for="nombre">Nombre del Producto</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ej: Laptop Dell" />
              <span class="error-message" id="error-nombre"></span>
            </div>

            <div class="form-group">
              <label for="precio">Precio</label>
              <input type="number" id="precio" name="precio" placeholder="000" />
              <span class="error-message" id="error-precio"></span>
            </div>

            <div class="form-group">
              <label for="categoria">Categoría</label>
              <input type="text" id="categoria" name="categoria" placeholder="Ej: Electrónicos" />
              <span class="error-message" id="error-categoria"></span>
            </div>

            <button type="submit" class="btn btn-primary">Agregar Producto</button>
          </form>
        </form>
      </div>
    </section>
  </div>

    <section class="card">
      <div class="card-header">
        <h2>Productos Registrados</h2>
      </div>
      <div class="card-content">
        <div id="lista-productos" class="productos-lista">
          <div class="productos-vacio">
            <p>No hay productos registrados. Agrega uno usando el formulario.</p>
          </div>
        </div>
      </div>
    </section>

  <script src="./js/script.js"></script>
</body>
</html>
